name: CI - Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/fe/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/ci-fe.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/fe/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/ci-fe.yml"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @career-intelligence/fe typecheck

      - name: Lint
        run: pnpm --filter @career-intelligence/fe lint

      - name: Build
        run: pnpm --filter @career-intelligence/fe build

      - name: Unit tests
        run: pnpm --filter @career-intelligence/fe test:unit
